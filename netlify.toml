"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Same-origin browser API. Netlify forwards /api to the existing Render service.
[[redirects]]
  from = "/api/*"
  to = "https://ledger-875b.onrender.com/api/:splat"
  status = 200
  force = true

# Keep the React Router fallback after the API proxy.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
