name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ledger-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install root dependencies
        run: npm ci
      # The current server lockfile is missing entries required by server/package.json.
      # npm install reconciles it in the CI workspace until the updated lockfile is committed.
      - name: Install server dependencies
        run: npm install --prefix server
      # The client lockfile is also currently out of sync with client/package.json.
      - name: Install client dependencies
        run: npm install --prefix client
      - run: npm run lint
      - run: npm test
      - run: npm run build:client
