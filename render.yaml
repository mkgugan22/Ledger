# render.yaml
services:
  - type: web
    name: ledger-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: https://ledger007.netlify.app
      - key: NODE_ENV
        value: production
